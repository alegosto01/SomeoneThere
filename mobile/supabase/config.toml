# Local Supabase stack. `supabase start` reads this; hosted settings live in the
# dashboard. No secrets here — Edge Function secrets go in `supabase secrets set`
# and the notify trigger reads its own from Vault (see migration 0005).
project_id = "someonethere"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]              # catches local auth emails
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "someonethere://"
additional_redirect_urls = ["someonethere://", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Local only: skip the confirmation round-trip. Hosted projects must keep
# confirmation ON.
enable_confirmations = false

[auth.external.google]
enabled = false          # set true once the OAuth client exists
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "someonethere://"

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
